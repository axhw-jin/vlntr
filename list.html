<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vlntr — 봉사 기회 참여 신청</title>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, "Malgun Gothic", sans-serif;
    line-height: 1.55;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 20px 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  /* 로그인 상태에서는 버튼이 많아지므로, 좁은 화면에서 줄바꿈되도록
     flex:none 대신 줄어들 수 있게 둔다 */
  .head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 10px; min-width: 0; }
  .who { font-size: 13px; color: var(--muted); }
  a.btn, button {
    font: inherit;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 8px;
    border: 0;
    background: var(--accent);
    color: var(--accent-fg);
    text-decoration: none;
    cursor: pointer;
  }
  a.btn:hover, button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { cursor: not-allowed; }
  button.ghost, a.btn.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }
  main { padding: 20px 16px 60px; }
  .count { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .count a { color: var(--accent); text-decoration: none; margin-left: 6px; }
  .count a:hover { text-decoration: underline; }
  .filters {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 12px;
  }
  .filters .f { display: grid; gap: 4px; min-width: 0; }
  .filters label { font-size: 12px; color: var(--muted); }
  /* 날짜 칸은 datepicker.js가 그리고 모양은 theme.css가 잡는다 */
  .filters select {
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
    color: var(--text);
    min-width: 0;
  }
  .filters select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .filters .f.date { width: 132px; }
  .filters .dash { color: var(--muted); padding-bottom: 9px; }
  .filters .reset { margin-left: auto; }
  /* 좁은 화면에서는 지역이 한 줄, 날짜 두 개가 그 아래 한 줄을 나눠 쓴다 */
  @media (max-width: 560px) {
    .filters .f.region { flex: 1 1 100%; }
    .filters .f.date { flex: 1 1 0; }
    .filters .dash { display: none; }
    .filters .reset { margin-left: 0; flex: 1 1 100%; }
  }
  /* 지도에서 넘어온 카드를 잠깐 강조한다 */
  .card.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  @media (prefers-reduced-motion: no-preference) {
    .card.flash { transition: box-shadow 0.4s ease, border-color 0.4s ease; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .org { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-weak);
    border-radius: 999px;
    padding: 1px 9px;
    margin-left: 6px;
    vertical-align: middle;
  }
  dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; row-gap: 6px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .actions { margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button.applied { background: var(--ok-weak); color: var(--ok); }
  button.full { background: var(--line); color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); }
  .note.done { color: var(--ok); }
  .apply-form {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: grid;
    gap: 8px;
  }
  .apply-form input {
    font: inherit;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
    color: var(--text);
  }
  .apply-form input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .apply-form .row { display: flex; align-items: center; gap: 10px; }
  .form-error { font-size: 13px; color: var(--err); }
  .row-err { font-size: 13px; color: var(--err); }
  .roster {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 14px;
  }
  .roster h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .roster ul { margin: 0; padding-left: 18px; }
  .roster li { margin-bottom: 4px; }
  .roster .empty { color: var(--muted); }
  .badge.hidden-b { color: var(--warn); background: var(--warn-weak); }
  .desc {
    margin: 12px 0 0;
    font-size: 14px;
    color: var(--muted);
    white-space: pre-wrap;
    border-left: 2px solid var(--line);
    padding-left: 10px;
  }
  .status { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }
  .status.error { color: var(--err); }
  a.home { color: inherit; text-decoration: none; }
  a.home:hover { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="wrap head-row">
    <div>
      <h1><a class="home" href="./index.html">vlntr</a></h1>
      <p>봉사 기회를 확인하고 참여를 신청하세요.</p>
    </div>
    <div class="head-actions">
      <span class="head-slot" id="headActions"></span>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="화면 테마 전환"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="filters" id="filters" hidden>
    <div class="f region">
      <label for="fRegion">지역</label>
      <select id="fRegion"><option value="">전체 지역</option></select>
    </div>
    <div class="f date">
      <label for="fFrom">시작일</label>
      <div id="fFromDp"></div>
    </div>
    <span class="dash">~</span>
    <div class="f date">
      <label for="fTo">종료일</label>
      <div id="fToDp"></div>
    </div>
    <button type="button" class="ghost reset" id="fReset" hidden>초기화</button>
  </div>
  <p class="count" id="count"></p>
  <div id="list"><p class="status">불러오는 중…</p></div>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { createDatePicker } from "./datepicker.js";

const SUPABASE_URL = "https://cpkslszdgbdjhwpayocy.supabase.co";
const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwa3Nsc3pkZ2Jkamh3cGF5b2N5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Mjk5MDYsImV4cCI6MjEwMjAwNTkwNn0.jGLzzUzs6bV3OqNIaVhnfLh_rUxwn0mW8BFsfCfq_A8";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let user = null;        // 로그인한 사용자
let posts = [];         // 기회 목록
let myOppIds = new Set(); // 내가 신청한 기회 id
let rosters = {};       // { 기회 id: [신청자] } — 내가 올린 기회만
let openFormFor = null; // 신청 폼이 열린 기회 id

const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const headEl = document.getElementById("headActions");
const filtersEl = document.getElementById("filters");
const regionEl = document.getElementById("fRegion");
const resetEl = document.getElementById("fReset");

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

async function signIn() {
  await supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + location.pathname },
  });
}

async function signOut() {
  await supabase.auth.signOut();
}

function renderHeader() {
  if (user) {
    const label = user.user_metadata?.name || user.email || "로그인됨";
    headEl.innerHTML =
      '<span class="who">' + esc(label) + "</span>" +
      '<a class="btn" href="./new.html">기회 등록</a>' +
      '<a class="btn ghost" href="./mypage.html">마이페이지</a>' +
      '<button class="ghost" id="signOut">로그아웃</button>';
    document.getElementById("signOut").addEventListener("click", signOut);
  } else {
    headEl.innerHTML = '<button id="signIn">구글로 로그인</button>';
    document.getElementById("signIn").addEventListener("click", signIn);
  }
}

// ── 지역·날짜 필터 ──────────────────────────────────────
// location은 자유 입력이라 "서울 마포구 성산동"처럼 시/도가 맨 앞에 온다.
// 첫 낱말만 떼어 지역으로 쓰되, 정식 명칭으로 적은 것은 짧은 이름에 합친다.
// (안 그러면 "서울"과 "서울특별시"가 다른 항목으로 갈라진다)
const REGION_ALIAS = {
  서울특별시: "서울", 서울시: "서울",
  부산광역시: "부산", 부산시: "부산",
  대구광역시: "대구", 대구시: "대구",
  인천광역시: "인천", 인천시: "인천",
  광주광역시: "광주", 광주시: "광주",
  대전광역시: "대전", 대전시: "대전",
  울산광역시: "울산", 울산시: "울산",
  세종특별자치시: "세종", 세종시: "세종",
  경기도: "경기",
  강원특별자치도: "강원", 강원도: "강원",
  충청북도: "충북", 충청남도: "충남",
  전북특별자치도: "전북", 전라북도: "전북", 전라남도: "전남",
  경상북도: "경북", 경상남도: "경남",
  제주특별자치도: "제주", 제주도: "제주",
};

function regionOf(location) {
  const first = String(location || "").trim().split(/\s+/)[0] || "";
  return REGION_ALIAS[first] || first;
}

// event_date는 "2026-08-22 (토)" 형태다. 앞 10자가 ISO 날짜라 문자열끼리
// 비교해도 순서가 맞으므로 Date 객체를 만들 필요가 없다.
function dateOf(p) {
  const m = /^\d{4}-\d{2}-\d{2}/.exec(p.event_date || "");
  return m ? m[0] : "";
}

// 주소창의 ?region=&from=&to= 가 시작 상태를 정한다.
// onAuthStateChange가 즉시 한 번 울리므로 선언 시점에 읽어둔다.
let filters = readFiltersFromUrl();

function filtersActive() {
  return Boolean(filters.region || filters.from || filters.to);
}

function matches(p) {
  if (filters.region && regionOf(p.location) !== filters.region) return false;
  if (filters.from || filters.to) {
    const d = dateOf(p);
    if (!d) return false; // 날짜를 못 읽는 기회는 기간을 지정하면 뺀다
    if (filters.from && d < filters.from) return false;
    if (filters.to && d > filters.to) return false;
  }
  return true;
}

// 필터를 주소창에 남겨 새로고침·공유해도 그대로 열리게 한다
function readFiltersFromUrl() {
  const q = new URLSearchParams(location.search);
  return {
    region: q.get("region") || "",
    from: q.get("from") || "",
    to: q.get("to") || "",
  };
}

function writeFiltersToUrl() {
  const q = new URLSearchParams();
  if (filters.region) q.set("region", filters.region);
  if (filters.from) q.set("from", filters.from);
  if (filters.to) q.set("to", filters.to);
  const qs = q.toString();
  history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
}

function renderFilters() {
  const counts = new Map(); // 지역 → 건수
  for (const p of posts) {
    const r = regionOf(p.location);
    if (r) counts.set(r, (counts.get(r) || 0) + 1);
  }
  const names = [...counts.keys()].sort((a, b) => a.localeCompare(b, "ko"));
  // 목록에 없는 지역이 주소로 들어와도 선택 상태는 유지한다
  if (filters.region && !counts.has(filters.region)) names.push(filters.region);

  regionEl.innerHTML =
    '<option value="">전체 지역</option>' +
    names
      .map(
        (n) =>
          '<option value="' + esc(n) + '">' +
          esc(n) + " (" + (counts.get(n) || 0) + ")" +
          "</option>"
      )
      .join("");
  regionEl.value = filters.region;
  fromPicker.setValue(filters.from);
  toPicker.setValue(filters.to);
  resetEl.hidden = !filtersActive();
  filtersEl.hidden = false;
}

function setFilter(key, v) {
  filters[key] = v;
  // 시작일이 종료일보다 뒤면 방금 건드리지 않은 쪽을 끌어와 빈 결과를 막는다
  if (filters.from && filters.to && filters.from > filters.to) {
    if (key === "from") filters.to = filters.from;
    else if (key === "to") filters.from = filters.to;
  }
  writeFiltersToUrl();
  render();
}

const fromPicker = createDatePicker({
  mount: document.getElementById("fFromDp"),
  id: "fFrom",
  placeholder: "시작일",
  value: filters.from,
  onChange: (v) => setFilter("from", v),
});

const toPicker = createDatePicker({
  mount: document.getElementById("fToDp"),
  id: "fTo",
  placeholder: "종료일",
  value: filters.to,
  onChange: (v) => setFilter("to", v),
});

regionEl.addEventListener("change", function () {
  setFilter("region", regionEl.value);
});

resetEl.addEventListener("click", function () {
  filters = { region: "", from: "", to: "" };
  writeFiltersToUrl();
  render();
});

async function loadPosts() {
  const { data, error } = await supabase
    .from("opportunities")
    .select("*")
    .order("id");
  if (error) throw error;
  return data;
}

// 내가 신청한 기회 + 내가 올린 기회의 신청자 명단을 한 번에 가져온다.
// RLS가 본인 신청과 본인 소유 기회의 신청자만 내려준다.
//
// 전역 상태에 직접 push하면, 로그인 직후처럼 refresh()가 겹쳐 실행될 때
// 같은 신청자가 실행 횟수만큼 명단에 쌓인다. 결과를 모아 통째로 돌려준다.
async function loadMyApplications(loadedPosts) {
  const next = { myOppIds: new Set(), rosters: {} };
  if (!user) return next;

  const { data, error } = await supabase
    .from("applications")
    .select("id, opportunity_id, name, contact, user_id")
    .order("created_at");
  if (error) throw error;

  const ownedIds = new Set(
    loadedPosts.filter((p) => p.owner_id === user.id).map((p) => p.id)
  );
  for (const row of data) {
    if (row.user_id === user.id) next.myOppIds.add(row.opportunity_id);
    if (ownedIds.has(row.opportunity_id)) {
      (next.rosters[row.opportunity_id] = next.rosters[row.opportunity_id] || []).push(row);
    }
  }
  return next;
}

function rosterHtml(p) {
  const rows = rosters[p.id] || [];
  const body = rows.length
    ? "<ul>" +
      rows
        .map((r) => "<li>" + esc(r.name) + " — " + esc(r.contact) + "</li>")
        .join("") +
      "</ul>"
    : '<p class="empty">아직 신청자가 없습니다.</p>';
  return '<div class="roster"><h3>신청자 ' + rows.length + "명</h3>" + body + "</div>";
}

function card(p) {
  const isOwner = user && p.owner_id === user.id;
  const mine = myOppIds.has(p.id);
  const full = !mine && p.applied >= p.needed;

  let actions;
  if (isOwner) {
    actions =
      '<div class="actions">' +
        '<a class="btn ghost" href="./mypage.html">관리하기</a>' +
        '<span class="note">' + p.applied + " / " + p.needed + "명 신청</span>" +
      "</div>" + rosterHtml(p);
  } else if (openFormFor === p.id) {
    actions =
      '<form class="apply-form" data-id="' + p.id + '">' +
        '<input name="name" placeholder="이름" maxlength="50" autocomplete="name" required>' +
        '<input name="contact" placeholder="연락처 (전화번호 또는 이메일)" maxlength="100" required>' +
        '<div class="row">' +
          '<button type="submit">신청하기</button>' +
          '<button type="button" class="ghost" data-act="close" data-id="' + p.id + '">취소</button>' +
          '<span class="form-error" data-error="' + p.id + '"></span>' +
        "</div>" +
      "</form>";
  } else {
    let btn;
    if (mine) {
      btn = '<button class="applied" data-act="cancel" data-id="' + p.id + '">신청 완료 · 취소하기</button>';
    } else if (full) {
      btn = '<button class="full" disabled>모집 마감</button>';
    } else if (!user) {
      btn = '<button data-act="login">로그인하고 신청하기</button>';
    } else {
      btn = '<button data-act="open" data-id="' + p.id + '">참여 신청</button>';
    }
    const note = mine
      ? '<span class="note done">신청되었습니다. 기관에서 연락드립니다.</span>'
      : '<span class="note">' + p.applied + " / " + p.needed + "명 신청</span>";
    actions =
      '<div class="actions">' + btn + note +
        '<span class="row-err" data-error="' + p.id + '"></span>' +
      "</div>";
  }

  return (
    '<article class="card" id="opp-' + p.id + '">' +
      "<h2>" + esc(p.title) +
        (isOwner ? '<span class="badge">내가 올린 기회</span>' : "") +
        (p.hidden ? '<span class="badge hidden-b">숨김</span>' : "") +
      "</h2>" +
      '<p class="org">' + esc(p.org) + "</p>" +
      "<dl>" +
        "<dt>위치</dt><dd>" + esc(p.location) + "</dd>" +
        "<dt>날짜</dt><dd>" + esc(p.event_date) + "</dd>" +
        "<dt>시간</dt><dd>" + esc(p.event_time) + "</dd>" +
        "<dt>인원</dt><dd>" + p.needed + "명 모집</dd>" +
      "</dl>" +
      (p.description ? '<p class="desc">' + esc(p.description) + "</p>" : "") +
      actions +
    "</article>"
  );
}

function render() {
  renderHeader();
  renderFilters();

  const shown = posts.filter(matches);
  countEl.innerHTML =
    (filtersActive()
      ? "조건에 맞는 기회 " + shown.length + "건 / 전체 " + posts.length + "건"
      : "모집 중인 기회 " + posts.length + "건") +
    ' <a href="./map.html">지도로 보기</a>';

  listEl.innerHTML = shown.length
    ? shown.map(card).join("")
    : '<p class="status">조건에 맞는 기회가 없습니다.</p>';
  jumpToHash();
}

// 지도에서 ./list.html#opp-3 으로 들어오면 그 카드로 내려간다.
// 카드는 비동기로 그려지므로 브라우저의 기본 이동은 이미 지나간 뒤다.
let jumped = false;
function jumpToHash() {
  if (jumped) return;
  const m = /^#opp-\d+$/.exec(location.hash);
  if (!m) return;
  const el = listEl.querySelector(location.hash);
  if (!el) return;
  jumped = true;
  el.scrollIntoView({ block: "center" });
  el.classList.add("flash");
}

// 오류는 해당 카드 안에 표시한다. render()가 카드를 다시 그리므로 그 뒤에 호출할 것.
function showRowError(id, text) {
  const el = listEl.querySelector('[data-error="' + id + '"]');
  if (el) el.textContent = text;
}

function setApplied(id, applied) {
  posts = posts.map((p) => (p.id === id ? Object.assign({}, p, { applied }) : p));
}

listEl.addEventListener("click", async function (e) {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const id = Number(btn.dataset.id);

  if (act === "login") return signIn();

  if (act === "open") {
    openFormFor = id;
    render();
    listEl.querySelector('form[data-id="' + id + '"] input[name="name"]')?.focus();
    return;
  }

  if (act === "close") {
    openFormFor = null;
    render();
    return;
  }

  if (act === "cancel") {
    btn.disabled = true;
    btn.textContent = "처리 중…";
    const { data, error } = await supabase.rpc("cancel_application", { opp_id: id });
    if (error) {
      // alert()은 페이지를 멈추므로 해당 카드 안에 표시한다
      console.error(error);
      await refresh();
      showRowError(id, "취소하지 못했습니다. 잠시 후 다시 시도해 주세요.");
      return;
    }
    myOppIds.delete(id);
    setApplied(id, data[0].applied);
    render();
  }
});

listEl.addEventListener("submit", async function (e) {
  const form = e.target.closest("form.apply-form");
  if (!form) return;
  e.preventDefault();

  const id = Number(form.dataset.id);
  const name = form.elements.name.value.trim();
  const contact = form.elements.contact.value.trim();
  const errorEl = form.querySelector("[data-error]");
  const submitBtn = form.querySelector('button[type="submit"]');

  if (!name || !contact) {
    errorEl.textContent = "이름과 연락처를 모두 입력해 주세요.";
    return;
  }

  errorEl.textContent = "";
  submitBtn.disabled = true;
  submitBtn.textContent = "신청 중…";

  const { data, error } = await supabase.rpc("apply_to_opportunity", {
    opp_id: id,
    applicant_name: name,
    applicant_contact: contact,
  });

  if (error) {
    console.error(error);
    submitBtn.disabled = false;
    submitBtn.textContent = "신청하기";
    errorEl.textContent =
      error.message === "opportunity is full"
        ? "모집이 마감되었습니다."
        : error.message === "already applied"
        ? "이미 신청한 기회입니다."
        : error.message === "login required"
        ? "로그인이 필요합니다."
        : "신청에 실패했습니다. 잠시 후 다시 시도해 주세요.";
    return;
  }

  myOppIds.add(id);
  setApplied(id, data[0].applied);
  openFormFor = null;
  render();
});

// 겹쳐 실행돼도 마지막 요청의 결과만 화면에 반영한다
let loadSeq = 0;

async function refresh() {
  const seq = ++loadSeq;
  try {
    const loadedPosts = await loadPosts();
    const mineData = await loadMyApplications(loadedPosts);
    if (seq !== loadSeq) return; // 더 최신 요청이 진행 중이면 이 결과는 버린다
    posts = loadedPosts;
    myOppIds = mineData.myOppIds;
    rosters = mineData.rosters;
    render();
  } catch (err) {
    console.error(err);
    if (seq !== loadSeq) return;
    listEl.innerHTML =
      '<p class="status error">기회를 불러오지 못했습니다. 새로고침해 주세요.</p>';
    countEl.textContent = "";
    filtersEl.hidden = true;
  }
}

supabase.auth.onAuthStateChange(function (_event, session) {
  user = session?.user || null;
  refresh();
});

const { data: sessionData } = await supabase.auth.getSession();
user = sessionData.session?.user || null;
await refresh();
</script>
