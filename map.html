<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vlntr — 봉사 기회 지도</title>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, "Malgun Gothic", sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 1160px; margin: 0 auto; }

  a.btn, button {
    font: inherit;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 8px;
    border: 0;
    background: var(--accent);
    color: var(--accent-fg);
    text-decoration: none;
    cursor: pointer;
  }
  a.btn:hover, button:hover:not(:disabled) { filter: brightness(1.08); }
  a.btn.ghost, button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }

  main { padding: 16px; }

  .toolbar {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 0 0 12px; font-size: 14px; color: var(--muted);
  }
  .toolbar a { color: var(--accent); text-decoration: none; }
  .toolbar a:hover { text-decoration: underline; }

  /* 왼쪽 목록 + 오른쪽 지도. 지도는 높이가 있어야 그려진다. */
  .split {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 16px;
    height: calc(100vh - 162px);
    min-height: 440px;
  }
  .side { overflow-y: auto; padding-right: 4px; }
  #map {
    height: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    overflow: hidden;
  }

  .pin {
    width: 100%;
    text-align: left;
    display: block;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    font: inherit;
  }
  .pin:hover:not(:disabled) { filter: none; border-color: var(--accent); }
  .pin[aria-current="true"] { border-color: var(--accent); background: var(--accent-weak); }
  .pin b, .pin span { display: block; }
  .pin b { font-size: 15px; font-weight: 600; }
  .pin .org { color: var(--muted); font-size: 13px; }
  .pin .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .pin .seat { color: var(--accent); font-size: 13px; font-weight: 600; }
  .pin.off { opacity: 0.62; cursor: default; }
  .pin.off:hover { border-color: var(--line); }

  .side h2 { margin: 18px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .status { color: var(--muted); font-size: 14px; padding: 16px 0; }
  .status.error { color: var(--err); }
  .fallback-note {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--warn);
    background: var(--warn-weak);
    border: 1px solid var(--warn-line);
    border-radius: 8px;
    padding: 8px 12px;
  }

  /* ── 말풍선 안쪽 (두 지도 공통) ───────────────────────── */
  .win b { font-size: 15px; }
  .win .org { color: var(--muted); font-size: 13px; }
  .win dl { margin: 8px 0 10px; display: grid; grid-template-columns: 40px 1fr; row-gap: 3px; font-size: 13px; }
  .win dt { color: var(--muted); }
  .win dd { margin: 0; }
  .win a.btn { font-size: 13px; padding: 7px 12px; display: inline-block; }

  /* ── 네이버 지도용 ──────────────────────────────────── */
  /* 네이버 지도에는 다크 스타일이 없어서 밝기를 직접 낮춘다.
     지도 전체에 필터를 걸면 그 위의 핀·말풍선까지 같이 죽는다.
     그래서 지도 타일 이미지에만 건다.
     타일 주소는 .../styles/... 이고 로고·축척은 .../maps/mantle/... 이라 구분된다.
     호스트는 http에서 map.naver.net, https에서 pstatic.net으로 달라지므로
     호스트 대신 경로로 고른다. (DOM 구조로 고르면 확대할 때 층이 새로 만들어져 풀린다) */
  #map.naver img[src*="/styles/"] { filter: var(--naver-dim, none); }

  /* 지도 핀. 끝점이 실제 좌표에 닿는 물방울 모양이라 위치가 분명하다.
     고를 때 커지는 기준점을 아래 끝으로 두어, 끝점은 제자리에 머문다. */
  .npin {
    width: 30px;
    height: 38px;
    cursor: pointer;
    transform-origin: 50% 100%;
    transition: transform 0.14s ease;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.32));
  }
  .npin svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .npin .body {
    fill: var(--pin);
    stroke: var(--pin-ink);
    stroke-width: 2;
  }
  .npin .dot { fill: var(--pin-ink); }
  .npin.on { transform: scale(1.22); }
  /* 모집이 끝난 곳은 한 톤 죽여 남은 자리가 있는 곳이 먼저 눈에 들어오게 */
  .npin.full { filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.22)); }
  .npin.full .body { fill: var(--pin-off); }
  @media (prefers-reduced-motion: reduce) {
    .npin { transition: none; }
  }
  /* Leaflet 대체 지도에서 divIcon 기본 배경 제거 */
  .leaflet-div-icon { background: transparent; border: 0; }
  .mapwrap { position: relative; height: 100%; min-height: 0; }

  /* 말풍선은 지도 위에 직접 띄운다. 핀은 항상 가로 가운데에 오도록 지도를 옮기므로
     가로 위치는 고정이고, 세로만 계산해서 bottom으로 넣는다. */
  .nwin {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    box-sizing: border-box;
    width: 250px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 4px 14px var(--shadow);
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.5;
  }
  .nwin .close {
    float: right;
    background: none; border: 0; padding: 0 0 0 8px;
    color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;
  }

  /* ── Leaflet용 (키가 없을 때 대체 지도) ──────────────── */
  .leaflet-tile-pane { filter: var(--map-dim, none); }
  .leaflet-container { background: var(--bg); font: inherit; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--card);
    color: var(--text);
    box-shadow: 0 4px 14px var(--shadow);
  }
  .leaflet-popup-content-wrapper { border: 1px solid var(--line); border-radius: 10px; }
  .leaflet-popup-content { margin: 12px 24px 12px 14px; font-size: 14px; line-height: 1.5; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .leaflet-bar {
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: none;
    overflow: hidden;
  }
  .leaflet-bar a, .leaflet-bar a:hover {
    background: var(--card);
    color: var(--muted);
    border-bottom-color: var(--line);
    width: 28px; height: 28px; line-height: 28px; font-size: 16px;
  }
  .leaflet-bar a:hover { color: var(--text); }
  .leaflet-control-attribution {
    background: none;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.4;
    padding: 0 4px;
    margin: 0 2px 2px 0;
    opacity: 0.75;
  }
  .leaflet-control-attribution a { color: var(--muted); text-decoration: none; }
  .leaflet-control-attribution:hover { opacity: 1; }

  @media (max-width: 860px) {
    .split {
      grid-template-columns: 1fr;
      height: auto;
      min-height: 0;
    }
    .mapwrap { height: 46vh; min-height: 300px; order: -1; }
    .side { overflow: visible; max-height: none; }
  }
</style>
</head>
<body>
<header id="topbar"></header>
<script type="module">
  import { mountNav } from "./nav.js";
  window.vlntrNav = mountNav({ current: "map" });
</script>

<main class="wrap">
  <p class="toolbar"><span id="count">불러오는 중…</span></p>
  <div class="split">
    <div class="side">
      <p class="fallback-note" id="fallbackNote" hidden></p>
      <div id="pins"></div>
      <div id="unmapped"></div>
    </div>
    <div class="mapwrap">
      <div id="map"></div>
      <!-- 네이버 지도용 말풍선. 네이버 InfoWindow는 기준점이 예측대로 움직이지 않아
           직접 띄운다. Leaflet 대체 지도에서는 쓰지 않는다. -->
      <div class="nwin" id="mapWin" hidden></div>
    </div>
  </div>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ── 네이버 지도 키 ──────────────────────────────────────
// 네이버 클라우드 플랫폼 콘솔에서 발급받은 Client ID를 넣으면 네이버 지도로 바뀐다.
// 비워두면 OpenStreetMap 지도를 쓴다. (콘솔에서 Dynamic Map 체크 + 서비스 URL 등록 필수)
// 이 값은 스크립트 주소에 그대로 드러나므로 비밀이 아니다. 보호는 등록한 도메인으로 한다.
const NAVER_CLIENT_ID = "yx1bkl8eal";

const SUPABASE_URL = "https://cpkslszdgbdjhwpayocy.supabase.co";
const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwa3Nsc3pkZ2Jkamh3cGF5b2N5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Mjk5MDYsImV4cCI6MjEwMjAwNTkwNn0.jGLzzUzs6bV3OqNIaVhnfLh_rUxwn0mW8BFsfCfq_A8";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SEOUL = [37.5665, 126.978];
const GEO_KEY = "vlntr-geo-v1";

const countEl = document.getElementById("count");
const pinsEl = document.getElementById("pins");
const unmappedEl = document.getElementById("unmapped");
const mapEl = document.getElementById("map");
const noteEl = document.getElementById("fallbackNote");

let user = null;
let posts = [];
let selected = null;
let gmap = null; // 지도 어댑터 (네이버 또는 Leaflet)

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function token(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// 두 지도가 같은 핀을 쓴다. 색은 CSS(토큰)가 정하므로 테마를 그대로 따라간다.
const PIN_W = 30;
const PIN_H = 38;
const PIN_H_ON = 46; // 고른 핀은 1.22배로 커진다 (아래 끝 기준)
function mapPinHtml(it, on) {
  return (
    '<div class="npin' + (on ? " on" : "") + (it.full ? " full" : "") + '">' +
      '<svg viewBox="-1.5 -1.5 33 41" aria-hidden="true">' +
        '<path class="body" d="M15 0C6.7 0 0 6.7 0 15c0 10.9 13 21.6 13.6 22.1a2.2 2.2 0 0 0 2.8 0C17 36.6 30 25.9 30 15 30 6.7 23.3 0 15 0z"/>' +
        '<circle class="dot" cx="15" cy="14.6" r="5"/>' +
      "</svg>" +
    "</div>"
  );
}

function renderHeader() {
  window.vlntrNav.setAuth(user, signIn, signOut);
}

function signIn() {
  supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + location.pathname },
  });
}

function signOut() {
  supabase.auth.signOut();
}

// ── 스크립트 로더 ───────────────────────────────────────
function loadScript(src) {
  return new Promise(function (resolve, reject) {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = function () { reject(new Error("script load failed: " + src)); };
    document.head.appendChild(s);
  });
}

function loadCss(href) {
  return new Promise(function (resolve) {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = href;
    l.onload = resolve;
    l.onerror = resolve; // 스타일이 늦어도 지도는 뜬다
    document.head.appendChild(l);
  });
}

// 네이버 지도 스크립트. 인증 실패는 전역 콜백으로만 알려주므로 그것도 함께 지켜본다.
// 파라미터 이름이 ncpKeyId(신) / ncpClientId(구)로 갈려 있어 순서대로 시도한다.
async function loadNaver(clientId) {
  const params = ["ncpKeyId", "ncpClientId"];
  let lastErr = null;

  for (const p of params) {
    try {
      await new Promise(function (resolve, reject) {
        const timer = setTimeout(function () { reject(new Error("naver maps timeout")); }, 8000);
        window.navermap_authFailure = function () {
          clearTimeout(timer);
          reject(new Error("naver maps auth failed"));
        };
        loadScript("https://oapi.map.naver.com/openapi/v3/maps.js?" + p + "=" + encodeURIComponent(clientId))
          .then(function () {
            // 인증 실패 콜백이 뒤늦게 올 수 있어 조금 기다렸다가 확정한다
            setTimeout(function () {
              clearTimeout(timer);
              if (window.naver && window.naver.maps) resolve();
              else reject(new Error("naver.maps missing"));
            }, 400);
          }, function (e) { clearTimeout(timer); reject(e); });
      });
      return true;
    } catch (err) {
      lastErr = err;
      delete window.naver;
    }
  }
  throw lastErr || new Error("naver maps unavailable");
}

// ── 지도 어댑터 ─────────────────────────────────────────
// 두 지도의 사용법이 달라서, 화면 쪽 코드가 쓰는 동작만 같은 이름으로 맞춘다.
function naverAdapter(onSelect) {
  mapEl.classList.add("naver");
  const nm = naver.maps;
  const map = new nm.Map(mapEl, {
    center: new nm.LatLng(SEOUL[0], SEOUL[1]),
    zoom: 11,
    scrollWheel: false,
    zoomControl: true,
    zoomControlOptions: { style: nm.ZoomControlStyle.SMALL, position: nm.Position.TOP_LEFT },
    mapDataControl: false,
  });
  // 목록을 훑다가 지도 위에서 휠이 잡히지 않도록, 지도를 누른 뒤에만 확대를 켠다
  nm.Event.addListener(map, "click", function () { map.setOptions("scrollWheel", true); });
  mapEl.addEventListener("mouseleave", function () { map.setOptions("scrollWheel", false); });

  let items = [];
  let overlays = {};
  // 핀 끝점이 좌표에 닿도록 아래 끝을 기준점으로 잡는다
  function naverIcon(it, on) {
    return {
      content: mapPinHtml(it, on),
      size: new nm.Size(PIN_W, PIN_H),
      anchor: new nm.Point(PIN_W / 2, PIN_H),
    };
  }

  const win = document.getElementById("mapWin");
  function closeWin() { win.hidden = true; }

  win.addEventListener("click", function (e) {
    if (e.target.closest("[data-close]")) closeWin();
  });
  // 지도를 끌면 핀이 움직이므로 말풍선은 닫는다
  nm.Event.addListener(map, "dragstart", closeWin);
  nm.Event.addListener(map, "zoom_start", closeWin);

  // 말풍선을 핀 바로 위에 놓는다.
  // setCenter 직후 핀은 지도 정중앙에 있으므로, 상자 높이만큼 자리가 모자라면
  // 지도를 그만큼 내려 핀을 아래로 보내고, 그 위 공간에 상자를 놓는다.
  function placeWindow(html) {
    win.innerHTML =
      '<button type="button" class="close" data-close="1" aria-label="닫기">&times;</button>' + html;
    win.hidden = false;

    const mapH = mapEl.getBoundingClientRect().height;
    const h = win.getBoundingClientRect().height;
    const middle = mapH / 2;  // 지금 핀 끝점이 있는 자리
    // 핀은 끝점에서 위로 PIN_H 만큼 서 있고, 그 위에 상자가 얹힌다
    const wanted = Math.min(h + PIN_H_ON + 18, mapH - 12);
    const dy = Math.round(middle - wanted);
    if (dy) map.panBy(new nm.Point(0, dy)); // 음수면 지도가 아래로 내려간다

    win.style.bottom = mapH - wanted + PIN_H_ON + 6 + "px";
  }

  return {
    setPins(list) {
      closeWin();
      Object.values(overlays).forEach(function (m) { m.setMap(null); });
      overlays = {};
      items = list;
      list.forEach(function (it) {
        const marker = new nm.Marker({
          position: new nm.LatLng(it.at[0], it.at[1]),
          map: map,
          icon: naverIcon(it, false),
          zIndex: it.full ? 5 : 10,
        });
        nm.Event.addListener(marker, "click", function () { onSelect(it.id); });
        overlays[it.id] = marker;
      });
    },
    focus(id) {
      const it = items.find(function (x) { return x.id === id; });
      if (!it) return;
      items.forEach(function (x) {
        const on = x.id === id;
        overlays[x.id].setIcon(naverIcon(x, on));
        overlays[x.id].setZIndex(on ? 30 : x.full ? 5 : 10);
      });
      // 애니메이션(morph)으로 옮기면 뒤따르는 위치 계산과 어긋나므로 즉시 옮긴다
      map.setZoom(Math.max(map.getZoom(), 14), false);
      map.setCenter(new nm.LatLng(it.at[0], it.at[1]));
      placeWindow(it.html);
    },
    fitAll(coords) {
      closeWin();
      if (!coords.length) return;
      const b = new nm.LatLngBounds(
        new nm.LatLng(coords[0][0], coords[0][1]),
        new nm.LatLng(coords[0][0], coords[0][1])
      );
      coords.forEach(function (c) { b.extend(new nm.LatLng(c[0], c[1])); });
      map.fitBounds(b, { top: 40, right: 40, bottom: 40, left: 40 });
    },
    restyle() {},
  };
}

async function leafletAdapter(onSelect) {
  await loadCss("https://unpkg.com/leaflet@1.9.4/dist/leaflet.css");
  await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js");

  const map = L.map(mapEl, { scrollWheelZoom: false, attributionControl: false })
    .setView(SEOUL, 11);
  L.control.attribution({ prefix: false, position: "bottomright" }).addTo(map);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom: 19,
    subdomains: "abcd",
    attribution:
      '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · © <a href="https://carto.com/attributions">CARTO</a>',
  }).addTo(map);
  map.on("click", function () { map.scrollWheelZoom.enable(); });
  map.on("mouseout", function () { map.scrollWheelZoom.disable(); });

  let overlays = {};
  let items = [];

  // 네이버 지도와 같은 핀을 쓴다
  function icon(it, on) {
    return L.divIcon({
      html: mapPinHtml(it, on),
      className: "",
      iconSize: [PIN_W, PIN_H],
      iconAnchor: [PIN_W / 2, PIN_H],
      popupAnchor: [0, -PIN_H],
    });
  }

  return {
    setPins(list) {
      Object.values(overlays).forEach(function (m) { m.remove(); });
      overlays = {};
      items = list;
      list.forEach(function (it) {
        const m = L.marker(it.at, { icon: icon(it, false), zIndexOffset: it.full ? 0 : 100 })
          .addTo(map)
          .bindPopup('<div class="win">' + it.html + "</div>");
        m.on("click", function () { onSelect(it.id); });
        overlays[it.id] = m;
      });
    },
    focus(id) {
      items.forEach(function (x) {
        overlays[x.id].setIcon(icon(x, x.id === id));
      });
      const m = overlays[id];
      if (!m) return;
      map.setView(m.getLatLng(), Math.max(map.getZoom(), 14), { animate: true });
      m.openPopup();
    },
    fitAll(coords) {
      if (coords.length) map.fitBounds(L.latLngBounds(coords), { padding: [40, 40], maxZoom: 15 });
    },
    restyle() {}, // 핀 색은 CSS 토큰이라 테마를 저절로 따라간다
  };
}

async function makeMap(onSelect) {
  if (NAVER_CLIENT_ID) {
    try {
      await loadNaver(NAVER_CLIENT_ID);
      return naverAdapter(onSelect);
    } catch (err) {
      console.error(err);
      noteEl.hidden = false;
      noteEl.textContent =
        "네이버 지도를 불러오지 못해 기본 지도로 표시합니다. 콘솔에서 서비스 URL 등록과 Dynamic Map 사용 설정을 확인해 주세요.";
      mapEl.classList.remove("naver");
      mapEl.innerHTML = "";
    }
  }
  return leafletAdapter(onSelect);
}

// 테마가 바뀌면 핀 색을 다시 칠한다 (그릴 때 계산해 둔 값이라 자동으로 안 바뀐다)
new MutationObserver(function () { if (gmap) gmap.restyle(); }).observe(
  document.documentElement,
  { attributes: true, attributeFilter: ["data-theme"] }
);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
  if (gmap) gmap.restyle();
});

// ── 위치 찾기 (Nominatim) ────────────────────────────────
// 좌표 컬럼이 아직 없으므로 주소 문자열로 그때그때 찾고, 브라우저에 캐시한다.
// 정책상 초당 1회로 제한되어 있어 캐시에 없는 것만 순서대로 처리한다.
function loadCache() {
  try { return JSON.parse(localStorage.getItem(GEO_KEY) || "{}"); }
  catch (e) { return {}; }
}
function saveCache(cache) {
  try { localStorage.setItem(GEO_KEY, JSON.stringify(cache)); } catch (e) {}
}

async function geocode(text) {
  const url =
    "https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q=" +
    encodeURIComponent(text);
  const res = await fetch(url, { headers: { Accept: "application/json" } });
  if (!res.ok) throw new Error("geocode failed: " + res.status);
  const data = await res.json();
  if (!data.length) return null;
  return [Number(data[0].lat), Number(data[0].lon)];
}

async function resolveAll(list) {
  const cache = loadCache();
  const todo = list.filter((p) => !(p.location in cache));
  let done = 0;

  for (const p of todo) {
    countEl.textContent = "위치 찾는 중… " + ++done + " / " + todo.length;
    try {
      cache[p.location] = await geocode(p.location);
    } catch (err) {
      console.error(err);
      cache[p.location] = null; // 실패도 기록해 매번 다시 부르지 않는다
    }
    saveCache(cache);
    if (done < todo.length) await new Promise((r) => setTimeout(r, 1100));
  }
  return cache;
}

// 같은 동네가 여러 건이면 핀이 완전히 겹치므로 아주 조금씩 흩어 놓는다
function spread(list, cache) {
  const seen = {};
  return list.map(function (p) {
    const base = cache[p.location];
    if (!base) return { post: p, at: null };
    const k = base.join(",");
    const n = (seen[k] = (seen[k] || 0) + 1) - 1;
    const angle = n * 2.4;
    const r = n === 0 ? 0 : 0.0006 * Math.ceil(n / 6);
    return { post: p, at: [base[0] + r * Math.cos(angle), base[1] + r * Math.sin(angle)] };
  });
}

function winHtml(p) {
  const left = Math.max(0, p.needed - p.applied);
  return (
    "<b>" + esc(p.title) + "</b>" +
    '<div class="org">' + esc(p.org) + "</div>" +
    "<dl>" +
      "<dt>위치</dt><dd>" + esc(p.location) + "</dd>" +
      "<dt>날짜</dt><dd>" + esc(p.event_date) + "</dd>" +
      "<dt>시간</dt><dd>" + esc(p.event_time) + "</dd>" +
      "<dt>인원</dt><dd>" + (left ? left + "자리 남음" : "모집 마감") + "</dd>" +
    "</dl>" +
    '<a class="btn" href="./list.html#opp-' + p.id + '">목록에서 신청하기</a>'
  );
}

function pinHtml(p, mapped) {
  const left = Math.max(0, p.needed - p.applied);
  return (
    '<button class="pin' + (mapped ? "" : " off") + '"' +
      (mapped ? ' data-id="' + p.id + '"' : " disabled") + ">" +
      "<b>" + esc(p.title) + "</b>" +
      '<span class="org">' + esc(p.org) + "</span>" +
      '<span class="meta">' + esc(p.location) + " · " + esc(p.event_date) + "</span>" +
      '<span class="' + (left ? "seat" : "meta") + '">' +
        (left ? left + "자리 남음" : "모집 마감") +
      "</span>" +
    "</button>"
  );
}

function select(id) {
  selected = id;
  pinsEl.querySelectorAll(".pin").forEach(function (b) {
    b.setAttribute("aria-current", String(Number(b.dataset.id) === id));
  });
  if (gmap) gmap.focus(id);
}

function draw(resolved) {
  const mapped = resolved.filter((r) => r.at);
  const missing = resolved.filter((r) => !r.at);

  if (gmap) {
    gmap.setPins(mapped.map((r) => ({
      id: r.post.id,
      at: r.at,
      full: r.post.applied >= r.post.needed, // 마감된 곳은 핀 색을 죽인다
      html: '<div class="win">' + winHtml(r.post) + "</div>",
    })));
    gmap.fitAll(mapped.map((r) => r.at));
  }

  countEl.textContent =
    "기회 " + resolved.length + "건 중 " + mapped.length + "곳을 지도에 표시했습니다";

  pinsEl.innerHTML = mapped.length
    ? mapped.map((r) => pinHtml(r.post, true)).join("")
    : '<p class="status">지도에 표시할 기회가 없습니다.</p>';

  unmappedEl.innerHTML = missing.length
    ? "<h2>위치를 찾지 못한 기회 " + missing.length + "건</h2>" +
      missing.map((r) => pinHtml(r.post, false)).join("")
    : "";
}

pinsEl.addEventListener("click", function (e) {
  const b = e.target.closest(".pin[data-id]");
  if (b) select(Number(b.dataset.id));
});

async function load() {
  try {
    const { data, error } = await supabase
      .from("opportunities")
      .select("*")
      .order("id");
    if (error) throw error;
    posts = data;

    if (!posts.length) {
      countEl.textContent = "등록된 기회가 없습니다";
      pinsEl.innerHTML = '<p class="status">아직 올라온 기회가 없습니다.</p>';
      return;
    }

    const cache = await resolveAll(posts);
    draw(spread(posts, cache));
  } catch (err) {
    console.error(err);
    countEl.textContent = "";
    pinsEl.innerHTML =
      '<p class="status error">기회를 불러오지 못했습니다. 새로고침해 주세요.</p>';
  }
}

supabase.auth.onAuthStateChange(function (_event, session) {
  user = session?.user || null;
  renderHeader();
});

const { data: sessionData } = await supabase.auth.getSession();
user = sessionData.session?.user || null;
renderHeader();

gmap = await makeMap(select);
load();
</script>
